[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allesfitter"
dynamic = ["version"]
description = "A global inference framework for photometry and RV"
authors = [
    {name = "Jerome de Leon", email = "jpdeleon@g.ecc.u-tokyo.ac.jp"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
]
dependencies = [
    "typer>=0.12.0",
    "dynesty==2.0.0",
    "corner==2.2.1",
    "pandas>=2.1.0",
    "astropy>=5.3",
    "lightkurve==2.4.2",
    "tess-point",
    "scipy>=1.11.3",
    "numpy>=1.26.0,<2.0",
    "seaborn==0.12",
    "statsmodels>=0.14.0",
    "celerite==0.4.2",
    "brokenaxes==0.5.0",
    "rebound==3.20.0",
    "loguru==0.7.3",
    "emcee>=3.0.0",
    "setuptools<81",
    "ellc",
    "limbdark @ git+https://github.com/jpdeleon/limbdark2.git",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "black>=24.0",
    "ruff>=0.4",
    "pre-commit>=3.5",
]
ultranest = [
    "ultranest>=4.0",
    "h5py",  # required by ultranest for its log_dir/resume backend
]
webgui = [
    "fastapi>=0.128.8",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "uvicorn>=0.39.0",
]

[project.urls]
Homepage = "https://github.com/MNGuenther/allesfitter"
Download = "https://github.com/jpdeleon/allesfitter2"

[project.scripts]
prepare_allesfit = "allesfitter.scripts:prepare_allesfit"
run_allesfitter_grid = "allesfitter.scripts:run_allesfitter_grid"
allesfitter-gui = "allesfitter.webgui.cli:main"
allesfitter = "allesfitter.cli:app"

[tool.setuptools.packages.find]
where = ["."]

# Ship the web GUI's Jinja2 templates + static assets inside the wheel.
[tool.setuptools.package-data]
"allesfitter.webgui" = ["templates/*.html", "static/*"]

# Version is read from a single source of truth: allesfitter/_version.py.
# Bump __version__ there and the build, runtime, and installed metadata all
# follow automatically. setuptools parses the attribute statically (no import).
[tool.setuptools.dynamic]
version = {attr = "allesfitter._version.__version__"}

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that run real samplers (deselect with '-m \"not slow\"')",
    "unit: fast unit tests (default)",
]

# Black: the canonical formatter (wired via pre-commit). line-length matches
# ruff so the two tools never fight over wrapping. Exclude generated/static and
# notebook-checkpoint trees.
[tool.black]
line-length = 100
target-version = ["py38"]
extend-exclude = '''
/(
    allesfitter/_static
  | \.ipynb_checkpoints
)/
'''

# Ruff: linter + formatter. target-version stays py38 until the runtime env is
# migrated to 3.11 (see CI). Keep the legacy rule set lenient so the large
# pre-existing codebase is not flagged wholesale; tighten per-module as files
# are modernized.
[tool.ruff]
target-version = "py38"
line-length = 100
extend-exclude = [
    "allesfitter/_static",
    "**/.ipynb_checkpoints",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter; legacy lines are long
    "E741",  # ambiguous var names (l, I) are common in the science code
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]   # re-exports and lazy imports by design
"*.ipynb" = ["E402", "E701", "E722"]  # notebook cell structure prevents top-level imports
# Source files with intentional conditional/lazy imports after module-level code
"allesfitter/cli.py" = ["B008"]
"allesfitter/basement.py" = ["E402"]
"allesfitter/computer.py" = ["E402"]
"allesfitter/deriver.py" = ["E402"]
"allesfitter/detection/injection_recovery.py" = ["E402"]
"allesfitter/exoworlds_rdx/lightcurves/gp_decor.py" = ["E402"]
"allesfitter/exoworlds_rdx/rvs/estimate_jitter.py" = ["E402"]
"allesfitter/general_output.py" = ["E402"]
"allesfitter/mcmc.py" = ["E402"]
"allesfitter/mcmc_output.py" = ["E402"]
"allesfitter/nested_sampling.py" = ["E402"]
"allesfitter/nested_sampling_output.py" = ["E402"]
"allesfitter/optimize.py" = ["E402"]
"allesfitter/plot_top_down_view.py" = ["E402"]
"allesfitter/prepare_ttv_fit.py" = ["E402"]
"allesfitter/spots.py" = ["E402"]
"allesfitter/utils/colormaputil.py" = ["E402"]
"allesfitter/v2/classes.py" = ["E402"]
"allesfitter/v2/defaults.py" = ["E402"]
"allesfitter/v2/detection/injection_recovery_output.py" = ["E402"]
"allesfitter/v2/detection/injection_recovery.py" = ["E402"]
"allesfitter/v2/detection/transit_search.py" = ["E402"]
"allesfitter/v2/simulate.py" = ["E402"]
"allesfitter/v2/translator.py" = ["E402"]

# Mypy: start lenient (the codebase is largely untyped). Tighten per-module by
# adding stricter overrides as type annotations are introduced.
[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true
files = ["allesfitter"]

#[tool.setuptools.include-package-data]
#true

[tool.uv]
no-binary-package = ["ellc"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.16",
]
