[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allesfitter"
dynamic = ["version"]
description = "A global inference framework for photometry and RV"
authors = [
    {name = "Jerome de Leon", email = "jpdeleon@g.ecc.u-tokyo.ac.jp"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
]
dependencies = [
    "dynesty==2.0.0",
    "corner==2.2.1",
    "pandas==1.5",
    "astropy==5.1",
    "lightkurve==2.4.2",
    "tess-point",
    "scipy==1.9",
    "numpy==1.23",
    "seaborn==0.12",
    "statsmodels==0.13.2",
    "celerite==0.4.2",
    "brokenaxes==0.5.0",
    "rebound==3.20.0",
    "loguru==0.7.3",
    "emcee>=3.0.0",
    "setuptools",
    "ellc",
    "limbdark @ git+https://github.com/jpdeleon/limbdark2.git",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "black>=24.0",
    "ruff>=0.4",
    "pre-commit>=3.5",
]
ultranest = [
    "ultranest>=4.0",
    "h5py",  # required by ultranest for its log_dir/resume backend
]

[project.urls]
Homepage = "https://github.com/MNGuenther/allesfitter"
Download = "https://github.com/jpdeleon/allesfitter2"

[project.scripts]
prepare_allesfit = "allesfitter.scripts:prepare_allesfit"

[tool.setuptools.packages.find]
where = ["."]

# Version is read from a single source of truth: allesfitter/_version.py.
# Bump __version__ there and the build, runtime, and installed metadata all
# follow automatically. setuptools parses the attribute statically (no import).
[tool.setuptools.dynamic]
version = {attr = "allesfitter._version.__version__"}

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that run real samplers (deselect with '-m \"not slow\"')",
    "unit: fast unit tests (default)",
]

# Black: the canonical formatter (wired via pre-commit). line-length matches
# ruff so the two tools never fight over wrapping. Exclude generated/static and
# notebook-checkpoint trees.
[tool.black]
line-length = 100
target-version = ["py38"]
extend-exclude = '''
/(
    allesfitter/_static
  | \.ipynb_checkpoints
)/
'''

# Ruff: linter + formatter. target-version stays py38 until the runtime env is
# migrated to 3.11 (see CI). Keep the legacy rule set lenient so the large
# pre-existing codebase is not flagged wholesale; tighten per-module as files
# are modernized.
[tool.ruff]
target-version = "py38"
line-length = 100
extend-exclude = [
    "allesfitter/_static",
    "**/.ipynb_checkpoints",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter; legacy lines are long
    "E741",  # ambiguous var names (l, I) are common in the science code
]

# Mypy: start lenient (the codebase is largely untyped). Tighten per-module by
# adding stricter overrides as type annotations are introduced.
[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true
files = ["allesfitter"]

