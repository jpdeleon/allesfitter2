<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}allesfitter{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">alles<span>fitter</span><em>gui</em></a>
    <nav>
      <a href="/" class="{% block nav_home %}{% endblock %}">Targets</a>
      <a href="/prepare" class="{% block nav_prepare %}{% endblock %}">Prepare</a>
      <a href="/fit" class="{% block nav_fit %}{% endblock %}">New fit</a>
      <a href="/jobs" class="{% block nav_jobs %}{% endblock %}">Jobs</a>
    </nav>
    <button id="theme-toggle" class="ghost" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
