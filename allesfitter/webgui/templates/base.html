<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}allesfitter{% endblock %}</title>
  <meta name="theme-color" content="#101820">
  <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v=7">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('index') }}" aria-label="allesfitter home">
        <span class="brand-mark" aria-hidden="true">af</span>
        <span class="brand-name">alles<span>fitter</span></span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="{{ url_for('index') }}" class="{% block nav_home %}{% endblock %}">Overview</a>
        <a href="{{ url_for('prepare_form') }}" class="{% block nav_prepare %}{% endblock %}">New fit</a>
        <a href="{{ url_for('jobs_page') }}" class="{% block nav_jobs %}{% endblock %}">Runs</a>
      </nav>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle color theme">
          <span aria-hidden="true">◐</span>
        </button>
      </div>
    </div>
  </header>
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script>window.AF_ROOT_PATH = {{ request.scope.root_path | tojson }};</script>
  <script src="{{ url_for('static', path='/app.js') }}?v=6"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
