[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not slow"
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: fast, isolated unit tests (tests/unit, tests/chromatic)
    integration: end-to-end / sampler-backed tests (tests/integration)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
