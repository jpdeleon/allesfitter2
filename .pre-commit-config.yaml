# Pre-commit hooks for allesfitter2.
#
# Setup (once per clone):
#     pip install pre-commit      # or: uv pip install pre-commit
#     pre-commit install
#
# Thereafter Ruff runs automatically on staged files at commit time.
# Run across the whole tree on demand with:
#     pre-commit run --all-files
#
# Ruff handles formatting, linting, and import sorting. The hook reads the same
# pyproject.toml configuration and uses the same pinned version as uv/CI.
default_language_version:
  python: python3

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(csv|ipynb)$'
      - id: end-of-file-fixer
        exclude: '\.(csv|ipynb)$'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
